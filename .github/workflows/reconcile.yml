---
name: Reconcile

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # for checkout

jobs:
  run:
    name: Reconcile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
      - run: pnpm reconcile
      - run: pnpm format
      - run: git restore .cursor .github/workflows pnpm-lock.yaml
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ vars.ECOSPARK_CLIENT_ID }}
          private-key: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          author: github-actions <41898282+github-actions[bot]@users.noreply.github.com>
          body: I ran `pnpm reconcile + pnpm format` 🧑‍💻
          branch: actions/reconcile
          commit-message: 'fix: reconcile + format'
          labels: 🤖 bot
          title: 'fix: reconcile + format'
          token: ${{ steps.generate-token.outputs.token }}
