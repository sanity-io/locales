---
name: Add changeset from conventional commits

on:
  # All the bots that open conventional-commit PRs here (squiggler-app[bot] for
  # autotranslate/reconcile, renovate[bot] for dependencies) push branches to this repository, so
  # the plain `pull_request` event is sufficient - secrets are available for same-repo PRs, and
  # the risky `pull_request_target` trigger is not needed.
  pull_request:
    types: [opened, synchronize]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read # for checkout

jobs:
  call:
    uses: sanity-io/.github/.github/workflows/changesets-from-conventional-commits.yml@main
    # Covers the bots that open conventional-commit PRs on this repo: squiggler-app[bot] opens the
    # autotranslate ("fix(<locale>): automated translation updates") and reconcile PRs,
    # renovate[bot] opens dependency PRs. ecospark[bot]/squiggler-legacy[bot] cover older bot
    # identities backed by the same app credentials.
    if: github.event.pull_request.user.login == 'squiggler-app[bot]' || github.event.pull_request.user.login == 'squiggler-legacy[bot]' || github.event.pull_request.user.login == 'ecospark[bot]' || github.event.pull_request.user.login == 'renovate[bot]'
    secrets:
      ECOSPARK_APP_ID: ${{ secrets.ECOSPARK_APP_ID }}
      ECOSPARK_APP_PRIVATE_KEY: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}
