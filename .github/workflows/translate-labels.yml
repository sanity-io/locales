name: AI translate labels

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read # for checkout
  pull-requests: write # for adjusting labels

jobs:
  adjust:
    name: Adjust labels
    if: contains(github.event.pull_request.head.ref, 'fix/auto/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ vars.ECOSPARK_CLIENT_ID }}
          private-key: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}

      - name: Adjust labels
        run: pnpm run ci:adjust-labels --merge-if-approved
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
