packages:
  - 'apps/*'
  - 'packages/*'
  - 'locales/*'

allowBuilds:
  esbuild: false

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@portabletext/*'
  - '@sanity/*'
  - '@types/*'
  - 'groq'
  - 'groq-js'
  - 'sanity'
  # Renovate security update: js-yaml@4.3.0 || 4.3.1
  - js-yaml@4.3.0 || 4.3.1
  # Renovate dependency updates can temporarily require a new get-it release
  - get-it
