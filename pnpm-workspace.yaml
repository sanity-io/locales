packages:
  - 'apps/*'
  - 'packages/*'
  - 'locales/*'

catalog:
  sanity: ^6.23.0

allowBuilds:
  esbuild: false

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@portabletext/*'
  - '@sanity/*'
  - '@types/*'
  - 'groq'
  - 'groq-js'
  - 'sanity'
  # Renovate security update: js-yaml@4.3.0 || 4.3.1
  - js-yaml@4.3.0 || 4.3.1
  # Renovate dependency updates can temporarily require a new get-it release
  - get-it
  # oxlint 1.94 and tsrs 7.1.0-beta.tsrs2, plus their native bindings, are inside the release-age window
  - oxlint
  - '@oxlint/*'
  - tsrs
  - '@tsrs/*'

overrides:
  sanity: 'catalog:'
